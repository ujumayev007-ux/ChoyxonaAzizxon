<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshxona Boshqaruv Paneli - ChoyxonaAzizxon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Header -->
    <header class="bg-slate-800 border-b border-slate-700 h-16 px-6 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
            <span class="text-2xl">🍳</span>
            <h1 class="text-lg font-bold tracking-wide">Oshxona Boshqaruv Paneli</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="/kitchen/tv" target="_blank" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-emerald-900/40">📺 TV Ekranni ochish</a>
            <div id="connection-status" class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-semibold">Ulangan</div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
        
        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-5 gap-4">
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Yangi buyurtmalar</p>
                <h3 id="count-approved" class="text-3xl font-bold text-amber-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tayyorlanmoqda</p>
                <h3 id="count-preparing" class="text-3xl font-bold text-blue-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tayyor</p>
                <h3 id="count-ready" class="text-3xl font-bold text-emerald-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Kilolik osh</p>
                <h3 id="count-osh" class="text-3xl font-bold text-orange-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Faol buyurtmalar</p>
                <h3 id="count-total" class="text-3xl font-bold text-purple-400 mt-1">0</h3>
            </div>
        </div>

        <!-- Orders Grid Container -->
        <div id="kitchen-orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-16 text-center text-slate-500">
                Hozircha faol buyurtmalar mavjud emas.
            </div>
        </div>

    </main>

    <script>
        const socket = io();

        socket.on('connect', () => {
            document.getElementById('connection-status').className = 'px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 text-xs font-semibold';
            document.getElementById('connection-status').innerText = 'Ulangan';
            loadKitchenOrders();
        });

        socket.on('disconnect', () => {
            document.getElementById('connection-status').className = 'px-3 py-1 rounded-full bg-rose-500/20 text-rose-400 text-xs font-semibold';
            document.getElementById('connection-status').innerText = 'Qayta ulanilmoqda...';
        });

        socket.on('kitchen_new_order', () => loadKitchenOrders());
        socket.on('order_status_updated', () => loadKitchenOrders());

        async function loadKitchenOrders() {
            try {
                const res = await fetch('/api/kitchen/orders');
                const json = await res.json();
                if (json.success) {
                    renderKitchenOrders(json.data);
                }
            } catch (e) {
                console.error('Failed to load kitchen orders', e);
            }
        }

        function renderKitchenOrders(orders) {
            let approved = 0, preparing = 0, ready = 0, oshCount = 0;
            
            orders.forEach(o => {
                if (o.status === 'TASDIQLANDI' || o.status === 'OSHXONAGA_YUBORILDI') approved++;
                if (o.status === 'TAYYORLANMOQDA') preparing++;
                if (o.status === 'TAYYOR') ready++;
                if (o.items.some(i => i.menuItem.name.toLowerCase().includes('osh'))) oshCount++;
            });

            document.getElementById('count-approved').innerText = approved;
            document.getElementById('count-preparing').innerText = preparing;
            document.getElementById('count-ready').innerText = ready;
            document.getElementById('count-osh').innerText = oshCount;
            document.getElementById('count-total').innerText = orders.length;

            const grid = document.getElementById('kitchen-orders-grid');
            if (orders.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500">Hozircha faol buyurtmalar mavjud emas.</div>`;
                return;
            }

            grid.innerHTML = orders.map(order => {
                const timeStr = new Date(order.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = new Date(order.createdAt).toLocaleDateString();
                return `
                    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 flex flex-col justify-between shadow-xl space-y-4">
                        <div class="flex justify-between items-start border-b border-slate-700 pb-4">
                            <div>
                                <h3 class="text-xl font-bold text-white">Buyurtma №${order.orderNumber}</h3>
                                <p class="text-sm font-semibold text-emerald-400 mt-0.5">Stol №${order.tableId} • Ofitsiant: ${order.waiter ? order.waiter.fullName : 'Nomaʼlum'}</p>
                            </div>
                            <span class="text-xs font-bold px-3 py-1 rounded-full ${order.status === 'approved' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : order.status === 'preparing' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'}">
                                ${(order.status === 'TASDIQLANDI' || order.status === 'OSHXONAGA_YUBORILDI') ? 'Tayyorlash kutilmoqda' : order.status === 'TAYYORLANMOQDA' ? 'Tayyorlanmoqda' : 'Tayyor'}
                            </span>
                        </div>

                        <div class="space-y-3 flex-1">
                            <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Taomlar va Miqdor:</p>
                            <ul class="space-y-2">
                                ${order.items.map(item => `
                                    <li class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                                        <span class="font-semibold text-slate-200">${item.menuItem.name}</span>
                                        <span class="text-emerald-400 font-bold">${item.quantity} ${item.menuItem.unit}</span>
                                    </li>
                                `).join('')}
                            </ul>
                            ${order.notes ? `<div class="bg-rose-500/10 border border-rose-500/30 p-3 rounded-xl text-xs text-rose-300 font-medium"><span class="font-bold">Izoh:</span> ${order.notes}</div>` : ''}
                        </div>

                        <div class="flex items-center justify-between pt-4 border-t border-slate-700 text-xs text-slate-400">
                            <span>Sana: ${dateStr} | Vaqt: ${timeStr}</span>
                            <div class="flex gap-2">
                                ${(order.status === 'TASDIQLANDI' || order.status === 'OSHXONAGA_YUBORILDI') ? `<button onclick="updateOrderStatus('${order.id}', 'TAYYORLANMOQDA')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-lg shadow-blue-900/30">Boshlash</button>` : ''}
                                ${order.status === 'TAYYORLANMOQDA' ? `<button onclick="updateOrderStatus('${order.id}', 'TAYYOR')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-900/30">Tayyor</button>` : ''}
                                ${order.status === 'TAYYOR' ? `<button onclick="updateOrderStatus('${order.id}', 'STOLGA_YETKAZILDI')" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl transition shadow-lg shadow-purple-900/30">Yakunlash</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function updateOrderStatus(orderId, status) {
            try {
                const res = await fetch(`/api/kitchen/orders/${orderId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const json = await res.json();
                if (json.success) {
                    loadKitchenOrders();
                } else {
                    alert(json.message || 'Buyurtmani yangilashda xatolik');
                }
            } catch (e) {
                alert('Server bilan aloqa uzildi');
            }
        }
    </script>
</body>
</html>
