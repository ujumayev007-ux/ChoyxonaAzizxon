<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChoyxonaAzizxon - Telegram Mini App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-28">

    <!-- Header -->
    <header class="bg-amber-600 text-white p-4 text-center shadow-md sticky top-0 z-50">
        <h1 class="text-lg font-bold">ChoyxonaAzizxon</h1>
        <p class="text-xs text-amber-100 mt-0.5">Xush kelibsiz! Marhamat, menyudan tanlang.</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Table Identification Badge -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-400">Sizning stolingiz:</p>
                <h3 class="text-base font-bold text-gray-800" id="table-badge">Stol ma’lumoti topilmadi</h3>
            </div>
            <button onclick="callWaiter()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                🔔 Ofitsiantni chaqirish
            </button>
        </div>

        <div class="space-y-3">
            <h2 class="font-bold text-gray-800 text-base">Menyu</h2>
            <nav id="menu-categories" class="flex gap-2 overflow-x-auto pb-1" aria-label="Menyu kategoriyalari"></nav>
            <div id="menu-items" class="grid gap-3"></div>
        </div>
    </main>

    <!-- Cart Floating Bar -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-4 shadow-xl hidden max-w-md mx-auto rounded-t-3xl">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Tanlanganlar:</p>
                <p class="font-bold text-gray-800 text-sm" id="cart-total">0 so'm</p>
            </div>
            <button onclick="sendOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-2xl text-xs font-semibold transition shadow-lg shadow-emerald-900/30">
                Buyurtma berish 🚀
            </button>
        </div>
    </div>

    <script>
        const socket = io();
        let cart = [];
        let menuCatalog = [];
        let menuCategories = [];
        let selectedMenuCategory = 'ALL';
        socket.on('menu_updated', loadMenuCatalog);
        let authenticatedCustomer = null;
        let verifiedTableId = null;
        let telegramInitData = '';

        // Initialize Telegram WebApp
        window.addEventListener('DOMContentLoaded', async () => {
            loadMenuCatalog();
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                telegramInitData = tg.initData;

                // Apply Telegram Theme Colors if available
                if (tg.colorScheme === 'dark') {
                    document.body.className = "bg-gray-950 text-gray-100 font-sans pb-28";
                }

                // Extract Table from URL parameters or Telegram startParam
                const urlParams = new URLSearchParams(window.location.search);
                let tableParam = urlParams.get('table');
                if (!tableParam && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                    const sp = tg.initDataUnsafe.start_param;
                    if (sp.startsWith('table_')) {
                        tableParam = sp.replace('table_', '');
                    }
                }

                if (tableParam) {
                    verifiedTableId = tableParam;
                    document.getElementById('table-badge').innerText = `Stol #${verifiedTableId}`;
                } else {
                    document.getElementById('table-badge').innerText = "Stol ma’lumoti topilmadi";
                }

                // Authenticate via Backend API using initData
                try {
                    const res = await fetch('/api/customer/telegram/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ initData: tg.initData, tableId: verifiedTableId })
                    });
                    const json = await res.json();
                    if (json.success) {
                        authenticatedCustomer = json.data.customer;
                    } else {
                        alert(json.message || "Telegram orqali autentifikatsiya qilishda xatolik yuz berdi");
                    }
                } catch (e) {
                    console.error('Auth request failed', e);
                }
            }
        });

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[char]));
        }

        async function loadMenuCatalog() {
            const itemsRoot = document.getElementById('menu-items');
            try {
                const [menuResponse, categoryResponse] = await Promise.all([
                    fetch('/api/menu'),
                    fetch('/api/menu/categories/public')
                ]);
                if (!menuResponse.ok || !categoryResponse.ok) throw new Error('Menyuni yuklab bo‘lmadi');
                const [items, categories] = await Promise.all([menuResponse.json(), categoryResponse.json()]);
                if (!Array.isArray(items) || !Array.isArray(categories)) throw new Error('Menyu ma’lumotlari noto‘g‘ri');
                menuCatalog = items;
                menuCategories = categories;
                renderMenuCatalog();
            } catch (error) {
                console.error('Menyuni yuklashda xatolik:', error);
                itemsRoot.innerHTML = `<p class="rounded-xl bg-rose-50 p-4 text-sm text-rose-700">${escapeHtml(error.message || 'Menyuni yuklab bo‘lmadi')}</p>`;
            }
        }

        function renderMenuCatalog() {
            const categoryRoot = document.getElementById('menu-categories');
            const itemsRoot = document.getElementById('menu-items');
            categoryRoot.innerHTML = [{ id: 'ALL', name: 'Barchasi' }, ...menuCategories].map(category => `
                <button type="button" data-category-id="${escapeHtml(category.id)}" aria-pressed="${selectedMenuCategory === category.id}"
                    class="shrink-0 rounded-full px-4 py-2 text-xs font-semibold transition ${selectedMenuCategory === category.id ? 'bg-amber-600 text-white' : 'border border-gray-200 bg-white text-gray-700 hover:bg-gray-100'}">
                    ${escapeHtml(category.name)}
                </button>`).join('');
            const visibleItems = menuCatalog.filter(item => selectedMenuCategory === 'ALL' || item.categoryId === selectedMenuCategory);
            itemsRoot.innerHTML = visibleItems.length ? visibleItems.map(item => `
                <article class="overflow-hidden rounded-2xl border border-gray-100 bg-white shadow-sm">
                    <div class="flex min-h-28 items-center gap-3 p-4">
                        <div class="flex h-24 w-24 shrink-0 items-center justify-center overflow-hidden rounded-xl bg-gray-100 text-center text-xs text-gray-400">
                            ${item.imageUrl
                                ? `<img src="${escapeHtml(item.imageUrl)}" alt="${escapeHtml(item.name)}" loading="lazy" class="h-full w-full object-cover" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>Rasm yuklanmadi</span>`
                                : 'Rasm mavjud emas'}
                        </div>
                        <div class="min-w-0 flex-1">
                            <h3 class="font-semibold text-gray-800">${escapeHtml(item.name)}</h3>
                            <p class="mt-1 line-clamp-2 text-xs text-gray-500">${escapeHtml(item.description || '')}</p>
                            <p class="mt-2 text-sm font-bold text-amber-700">${Number(item.sellingPrice || 0).toLocaleString('uz-UZ')} so‘m</p>
                        </div>
                        <button type="button" data-add-menu-item="${escapeHtml(item.id)}" class="shrink-0 rounded-xl bg-amber-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-amber-700">+ Qo‘shish</button>
                    </div>
                </article>`).join('') : '<p class="rounded-xl bg-white p-6 text-center text-sm text-gray-500">Bu kategoriyada hozircha taom yo‘q.</p>';
        }

        document.getElementById('menu-categories').addEventListener('click', event => {
            const button = event.target.closest('[data-category-id]');
            if (!button) return;
            selectedMenuCategory = button.dataset.categoryId;
            renderMenuCatalog();
        });

        document.getElementById('menu-items').addEventListener('click', event => {
            const button = event.target.closest('[data-add-menu-item]');
            if (!button) return;
            const item = menuCatalog.find(menuItem => menuItem.id === button.dataset.addMenuItem);
            if (item) addToOrder(item.id, item.name, Number(item.sellingPrice));
        });

        function callWaiter() {
            if (!verifiedTableId) {
                alert("Stol ma’lumoti topilmadi");
                return;
            }
            socket.emit('call_waiter', { tableNumber: verifiedTableId, time: new Date().toLocaleTimeString() });
            alert('Ofitsiantga chaqiruv yuborildi! Tez orada kelishadi.');
        }

        function addToOrder(dishId, name, price) {
            const existing = cart.find(i => i.dishId === dishId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ dishId, name, price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBar = document.getElementById('cart-bar');
            const totalEl = document.getElementById('cart-total');

            if (cart.length > 0) {
                cartBar.classList.remove('hidden');
                const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                totalEl.innerText = total.toLocaleString() + " so'm";
            } else {
                cartBar.classList.add('hidden');
            }
        }

        async function sendOrder() {
            if (!verifiedTableId) {
                alert("Stol ma’lumoti topilmadi. Buyurtma berib bo'lmaydi.");
                return;
            }

            if (!authenticatedCustomer) {
                alert("Telegram sessiyasi yaroqsiz");
                return;
            }

            const orderPayload = {
                tableId: verifiedTableId,
                customerId: authenticatedCustomer.id,
                initData: telegramInitData,
                items: cart.map(i => ({ dishId: i.dishId, quantity: i.quantity }))
            };

            try {
                const res = await fetch('/api/customer/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderPayload)
                });
                const json = await res.json();

                if (json.success) {
                    const totalSum = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toLocaleString();
                    alert(`Buyurtmangiz yuborildi, ofitsiant tez orada kelib tasdiqlaydi\n\nBuyurtma №${json.data.orderId}\nStol №${verifiedTableId}\nJami summa: ${totalSum} so'm`);
                    cart = [];
                    updateCartUI();
                } else {
                    alert(json.message || "Buyurtma yuborilmadi");
                }
            } catch (e) {
                alert("Server bilan aloqa uzildi");
            }
        }
    </script>
</body>
</html>
