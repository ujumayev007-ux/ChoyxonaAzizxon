<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Davomat</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 text-slate-800"><main class="max-w-5xl mx-auto p-5 space-y-5">
<header class="flex justify-between"><h1 class="text-2xl font-bold">Xodimlar davomati</h1><a id="back" href="/waiter/" class="text-blue-600">Panelga qaytish</a></header>
<p id="notice" role="alert" class="text-red-700"></p>
<section class="bg-white rounded-2xl p-5 space-y-3"><h2 class="font-bold" id="person">Kirish / chiqish</h2><p id="current"></p><form id="punch" class="flex flex-wrap gap-3"><select name="method" class="border rounded-lg p-2"></select><input name="credential" type="password" autocomplete="off" required placeholder="PIN yoki QR kodi" class="border rounded-lg p-2"><select name="action" class="border rounded-lg p-2"><option value="IN">Ishga kirish</option><option value="OUT">Ishdan chiqish</option></select><button class="bg-blue-600 text-white rounded-lg p-2">Saqlash</button><button type="button" id="scan" class="border rounded-lg p-2">QR skanerlash</button></form><video id="camera" class="hidden max-w-sm" autoplay playsinline></video><button id="stop-camera" class="hidden text-red-600" type="button">Kamerani yopish</button><p class="text-xs text-slate-500">QR uchun kamera va mos brauzer kerak. NFC va yuzni tanish qurilmalari ulanmagan.</p></section>
<section id="admin-config" class="hidden bg-white rounded-2xl p-5 space-y-3"><h2 class="font-bold">Davomat sozlamalari</h2><form id="config" class="grid sm:grid-cols-2 gap-3"><label><input name="enabled" type="checkbox"> Davomatni yoqish</label><div><label><input type="checkbox" name="methods" value="PIN"> PIN</label> <label><input type="checkbox" name="methods" value="QR"> QR</label></div><label>Boshlanish<input name="startTime" type="time" required class="border rounded p-2 w-full"></label><label>Tugash<input name="endTime" type="time" required class="border rounded p-2 w-full"></label><label>Vaqt mintaqasi<input name="timezone" value="Asia/Tashkent" required class="border rounded p-2 w-full"></label><label>Kechikish imtiyozi (daqiqa)<input name="graceMinutes" type="number" min="0" max="120" class="border rounded p-2 w-full"></label><button class="bg-blue-600 text-white rounded-lg p-2">Sozlamalarni saqlash</button></form><button id="qr-create" class="border rounded-lg p-2">Ish joyi uchun 1 daqiqalik QR yaratish</button><img id="qr-image" alt="Davomat QR kodi" class="hidden w-56"><p id="qr-expiry" class="text-sm"></p></section>
<section class="bg-white rounded-2xl p-5 space-y-3"><h2 class="font-bold">Davomat tarixi</h2><form id="history-filter" class="flex flex-wrap gap-3"><label>Boshlanish <input type="date" name="from" required class="border p-2 rounded"></label><label>Tugash <input type="date" name="to" required class="border p-2 rounded"></label><button class="border rounded-lg p-2">Ko‘rsatish</button></form><p class="text-xs text-slate-500">Ko‘pi bilan 93 kun, so‘nggi 500 yozuv. Vaqtlar qurilmangiz vaqt mintaqasida ko‘rsatiladi.</p><div id="history" class="overflow-x-auto"></div></section>
</main><script src="/attendance.js"></script></body></html>
