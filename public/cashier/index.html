<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassa paneli - ChoyxonaAzizxon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { color-scheme: light; }
        body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .nav-item.active { background: #eaf2ff; color: #1d4ed8; }
        .card { border: 1px solid #e2e8f0; border-radius: 16px; background: white; box-shadow: 0 5px 18px rgba(15, 23, 42, .045); }
        .btn { border-radius: 10px; font-weight: 700; transition: .15s ease; }
        .field { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; outline: none; }
        .field:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, .13); }
        .modal-backdrop { animation: fade .15s ease-out; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
        @media print { body * { visibility: hidden; } #print-root, #print-root * { visibility: visible; } #print-root { position: absolute; left: 0; top: 0; width: 100%; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">
    <section id="login-screen" class="min-h-screen hidden items-center justify-center p-4">
        <form id="login-form" class="card w-full max-w-md p-8 space-y-5">
            <div class="text-center">
                <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-blue-100 text-2xl">🪙</div>
                <h1 class="text-2xl font-black">Kassir tizimiga kirish</h1>
                <p class="mt-1 text-sm text-slate-500">Shaxsiy login va parolingizni kiriting</p>
            </div>
            <label class="block text-sm font-semibold">Login<input id="login-username" class="field mt-1" autocomplete="username" required></label>
            <label class="block text-sm font-semibold">Parol<input id="login-password" class="field mt-1" type="password" autocomplete="current-password" required></label>
            <p id="login-error" class="hidden rounded-lg bg-rose-50 p-3 text-sm text-rose-700"></p>
            <button class="btn w-full bg-blue-600 px-4 py-3 text-white hover:bg-blue-700">Kirish</button>
        </form>
    </section>

    <div id="app" class="hidden min-h-screen md:flex">
        <aside class="hidden w-64 shrink-0 flex-col border-r border-slate-200 bg-white md:flex">
            <div class="border-b border-slate-100 px-5 py-5">
                <div class="flex items-center gap-3">
                    <span class="grid h-10 w-10 place-items-center rounded-xl bg-blue-600 text-xl text-white">🪙</span>
                    <div><p class="font-black">ChoyxonaAzizxon</p><p class="text-xs text-slate-500">Kassa va POS</p></div>
                </div>
            </div>
            <nav id="navigation" class="flex-1 space-y-1 overflow-y-auto p-3">
                <button data-tab="dashboard" class="nav-item active w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">📊 Bosh sahifa</button>
                <button data-tab="orders" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🧾 Buyurtmalar</button>
                <button data-tab="tables" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🪑 Stollar</button>
                <button data-tab="takeaway" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🥡 Olib ketish</button>
                <button data-tab="payments" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">💳 To‘lovlar</button>
                <button data-tab="customers" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">👥 Mijozlar</button>
                <button data-tab="debts" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">📒 Qarzlar</button>
                <button data-tab="refunds" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">↩️ Qaytarishlar</button>
                <button data-tab="expenses" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">💸 Xarajatlar</button>
                <button data-tab="register" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">💰 Kassa / smena</button>
                <button data-tab="history" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🕘 Kassa tarixi</button>
                <button data-tab="reports" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">📈 Hisobotlar</button>
                <button data-tab="receipts" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🖨 Cheklar</button>
                <button data-tab="calls" class="nav-item w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🔔 Ofitsiant chaqiruvi</button>
                <button data-tab="printers" id="nav-printers" class="nav-item hidden w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold">🖨 Printer holati</button>
            </nav>
            <div class="space-y-3 border-t border-slate-100 p-4">
                <p class="flex items-center justify-between text-xs text-slate-500"><span>Socket.io</span><span id="connection-status" class="rounded-full bg-amber-100 px-2 py-1 text-amber-800">Ulanmoqda</span></p>
                <button id="admin-access-button" class="btn w-full border border-slate-200 bg-white px-3 py-2 text-sm hover:bg-slate-50">🔐 Adminga o‘tish</button>
                <button id="return-cashier-button" class="btn hidden w-full bg-violet-600 px-3 py-2 text-sm text-white hover:bg-violet-700">Kassir rejimiga qaytish</button>
                <button id="logout-button" class="w-full px-3 py-2 text-left text-sm font-semibold text-rose-600 hover:bg-rose-50">Tizimdan chiqish</button>
            </div>
        </aside>

        <main class="min-w-0 flex-1">
            <header class="sticky top-0 z-20 flex min-h-16 flex-wrap items-center justify-between gap-3 border-b border-slate-200 bg-white px-4 py-3 md:px-7">
                <div>
                    <h1 id="page-title" class="text-lg font-black">Bosh sahifa</h1>
                    <p id="header-user" class="text-xs text-slate-500"></p>
                </div>
                <div class="flex flex-1 items-center justify-end gap-2 sm:flex-none">
                    <div class="relative w-full max-w-xs">
                        <input id="global-search" class="field py-2 text-sm" placeholder="Buyurtma, mijoz, telefon, stol..." aria-label="Umumiy qidiruv">
                        <div id="search-results" class="absolute right-0 top-11 z-30 hidden max-h-96 w-full overflow-y-auto rounded-xl border border-slate-200 bg-white p-2 shadow-xl"></div>
                    </div>
                    <span id="live-clock" class="hidden rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold sm:block"></span>
                    <button data-action="new-order" class="btn whitespace-nowrap bg-blue-600 px-3 py-2 text-sm text-white hover:bg-blue-700">+ Yangi buyurtma</button>
                </div>
            </header>
            <nav id="mobile-navigation" class="flex gap-1 overflow-x-auto border-b border-slate-200 bg-white p-2 md:hidden">
                <button data-tab="dashboard" class="nav-item active rounded-lg px-3 py-2 text-xs font-bold">Bosh sahifa</button>
                <button data-tab="orders" class="nav-item rounded-lg px-3 py-2 text-xs font-bold">Buyurtmalar</button>
                <button data-tab="tables" class="nav-item rounded-lg px-3 py-2 text-xs font-bold">Stollar</button>
                <button data-tab="takeaway" class="nav-item rounded-lg px-3 py-2 text-xs font-bold">Olib ketish</button>
                <button data-tab="register" class="nav-item rounded-lg px-3 py-2 text-xs font-bold">Kassa</button>
                <button data-tab="customers" class="nav-item rounded-lg px-3 py-2 text-xs font-bold">Mijozlar</button>
            </nav>
            <div id="content" class="mx-auto max-w-[1600px] space-y-5 p-4 md:p-7"></div>
        </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="pointer-events-none fixed right-4 top-4 z-[80] space-y-2"></div>
    <div id="print-root" class="hidden"></div>

    <script>
        const socket = io();
        const state = { user: null, tab: 'dashboard', menu: [], customers: [], cart: [], selectedCustomer: null, currentOrder: null };
        const titles = {
            dashboard: 'Bosh sahifa', orders: 'Buyurtmalar', tables: 'Stollar', takeaway: 'Olib ketish / Soboy',
            payments: 'To‘lovlar tarixi', customers: 'Mijozlar', debts: 'Qarzlar',
            refunds: 'Qaytarishlar', expenses: 'Xarajatlar', register: 'Kassa / smena',
            history: 'Kassa tarixi', reports: 'Hisobotlar', receipts: 'Cheklar',
            calls: 'Ofitsiant chaqiruvi', printers: 'Printer holati'
        };
        const money = value => `${Number(value || 0).toLocaleString('uz-UZ')} so‘m`;
        const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[char]));
        const dateTime = value => value ? new Date(value).toLocaleString('uz-UZ', { dateStyle: 'short', timeStyle: 'short' }) : '—';
        const newKey = () => crypto.randomUUID();

        async function api(url, options = {}) {
            const response = await fetch(url, {
                credentials: 'same-origin',
                ...options,
                headers: { ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...(options.headers || {}) }
            });
            const data = await response.json();
            if (response.status === 401) {
                showLogin('Sessiya yakunlangan. Qayta kiring.');
                throw new Error(data.message || 'Tizimga qayta kiring');
            }
            if (response.status === 403) {
                showLogin(data.message || 'Kassir hisobi bilan tizimga kiring.');
                throw new Error(data.message || 'Bu amal uchun ruxsat yo‘q');
            }
            if (!response.ok || data.success === false) throw new Error(data.message || 'So‘rov bajarilmadi');
            return data;
        }

        function toast(message, type = 'success') {
            const node = document.createElement('div');
            node.className = `pointer-events-auto rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-xl ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
            node.textContent = message;
            document.getElementById('toast-root').appendChild(node);
            setTimeout(() => node.remove(), 3800);
        }

        function showLogin(message = '') {
            state.user = null;
            state.currentOrder = null;
            state.cart = [];
            closeModal();
            document.getElementById('app').classList.add('hidden');
            const screen = document.getElementById('login-screen');
            screen.classList.remove('hidden');
            screen.classList.add('flex');
            const error = document.getElementById('login-error');
            error.textContent = message;
            error.classList.toggle('hidden', !message);
        }

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('flex');
            document.getElementById('app').classList.remove('hidden');
            document.getElementById('header-user').textContent = `${state.user.fullName} · ${state.user.role === 'ADMIN' ? 'Admin' : 'Kassir'}`;
            document.getElementById('nav-printers').classList.toggle('hidden', state.user.role !== 'ADMIN');
            const terminalAdmin = Boolean(state.user.terminalAccessId);
            document.getElementById('admin-access-button').classList.toggle('hidden', terminalAdmin || state.user.role === 'ADMIN');
            document.getElementById('return-cashier-button').classList.toggle('hidden', !terminalAdmin);
            switchTab(state.tab);
        }

        async function verifySession() {
            try {
                const result = await api('/api/cashier/me');
                if (result.user?.role !== 'CASHIER' &&
                    !(result.user?.role === 'ADMIN' && result.user?.terminalAccessId)) {
                    showLogin('Kassir sifatida tizimga kiring.');
                    return;
                }
                state.user = result.user;
                showApp();
            } catch (error) {
                if (!document.getElementById('login-screen').classList.contains('flex')) showLogin();
            }
        }

        async function refreshMenu() {
            const response = await fetch('/api/menu', { credentials: 'same-origin' });
            if (!response.ok) throw new Error('Menyuni yuklab bo‘lmadi');
            state.menu = await response.json();
        }

        async function switchTab(tab) {
            if (!titles[tab]) return;
            state.tab = tab;
            document.querySelectorAll('[data-tab]').forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
            document.getElementById('page-title').textContent = titles[tab];
            document.getElementById('search-results').classList.add('hidden');
            const content = document.getElementById('content');
            content.innerHTML = '<div class="card p-8 text-center text-sm font-semibold text-slate-500">Yuklanmoqda...</div>';
            try {
                if (tab === 'dashboard') await renderDashboard();
                else if (tab === 'tables') await renderTables();
                else if (tab === 'orders' || tab === 'takeaway' || tab === 'refunds') await renderOrders(tab);
                else if (tab === 'payments') await renderPayments();
                else if (tab === 'customers') renderCustomers();
                else if (tab === 'debts') await renderDebts();
                else if (tab === 'expenses') await renderExpenses();
                else if (tab === 'register') await renderRegister();
                else if (tab === 'history') await renderHistory();
                else if (tab === 'reports') renderReports();
                else if (tab === 'receipts') await renderReceipts();
                else if (tab === 'calls') await renderCalls();
                else if (tab === 'printers') await renderPrinters();
            } catch (error) {
                content.innerHTML = `<div class="card border-rose-200 p-6 text-rose-700">${esc(error.message)} <button class="btn ml-3 bg-slate-100 px-3 py-2 text-slate-700" data-action="refresh">Qayta urinish</button></div>`;
            }
        }

        function statCard(label, value, icon, color = 'blue') {
            return `<article class="card p-4 sm:p-5"><div class="flex items-start justify-between"><p class="text-xs font-bold uppercase tracking-wide text-slate-500">${esc(label)}</p><span class="grid h-9 w-9 place-items-center rounded-xl bg-${color}-50 text-lg">${icon}</span></div><p class="mt-3 text-xl font-black text-slate-900 sm:text-2xl">${esc(value)}</p></article>`;
        }

        function orderSource(source) {
            return ({ CUSTOMER_WEB: '📱 Telegram', TELEGRAM_BOT: '🤖 Bot', WAITER: '👨‍🍳 Ofitsiant', CASHIER: '💵 Kassir' })[source] || 'Noma’lum';
        }

        function orderCard(order, options = {}) {
            const table = order.table ? `${order.table.room?.name || ''} · Stol ${order.table.number}` : 'Olib ketish';
            const customer = order.customer
                ? `${order.customer.firstName || ''} ${order.customer.lastName || ''}`.trim()
                : order.customerName;
            const customerPhone = order.customer?.phone || order.customerPhone;
            const items = (order.items || []).map(item => `<li class="flex justify-between gap-3 text-sm"><span>${esc(item.menuItem?.name || item.name)} × ${esc(item.quantity)}</span><b>${money(item.totalPrice)}</b></li>`).join('');
            const locked = order.processingBy ? `<p class="mt-2 rounded-lg bg-amber-50 px-3 py-2 text-xs font-semibold text-amber-800">🔒 ${esc(order.processingBy.fullName)} buyurtmani qayta ishlamoqda</p>` : '';
            const due = Number(order.totalAmount) - (order.payments || []).reduce((sum, payment) => sum + Number(payment.amount), 0) - Number(order.debt?.amount || 0);
            const hasPayments = (order.payments || []).some(payment => Number(payment.amount) > 0);
            const verificationReady = order.takeawayVerification && !order.takeawayVerification.usedAt &&
                new Date(order.takeawayVerification.expiresAt) > new Date() && order.takeawayVerification.attempts < 5;
            return `<article class="card space-y-3 p-4">
                <div class="flex flex-wrap items-start justify-between gap-2">
                    <div><div class="font-black">#${esc(order.orderNumber)}</div><p class="mt-1 text-xs text-slate-500">${esc(table)} · ${esc(orderSource(order.source))}</p></div>
                    <span class="rounded-full bg-blue-50 px-2.5 py-1 text-xs font-bold text-blue-700">${esc(order.status)}</span>
                </div>
                ${order.orderType === 'TAKEAWAY' ? `<p class="rounded-lg bg-violet-50 p-2 text-xs"><b>🥡 OLIB KETISH</b> · ${esc(customer || 'Mijoz ko‘rsatilmagan')} ${customerPhone ? `· ${esc(customerPhone)}` : ''}</p>` : ''}
                <ul class="space-y-1 border-y border-slate-100 py-2">${items}</ul>
                <div class="flex items-end justify-between"><div><p class="text-xs text-slate-500">Jami</p><b class="text-lg">${money(order.totalAmount)}</b></div><span class="text-xs text-slate-500">${dateTime(order.createdAt)}</span></div>
                ${locked}
                <div class="flex flex-wrap gap-2">
                    ${due > 0 && !options.closed ? `<button class="btn bg-blue-600 px-3 py-2 text-xs text-white hover:bg-blue-700" data-action="pay" data-id="${esc(order.id)}">To‘lov</button>` : ''}
                    ${order.orderType === 'TAKEAWAY' && !options.closed && verificationReady ? `<button class="btn bg-violet-600 px-3 py-2 text-xs text-white hover:bg-violet-700" data-action="verify-pickup" data-id="${esc(order.id)}">Kod / topshirish</button>` : ''}
                    ${order.orderType === 'TAKEAWAY' && !options.closed && !verificationReady && state.user.role === 'ADMIN' ? `<button class="btn bg-amber-600 px-3 py-2 text-xs text-white" data-action="renew-code" data-id="${esc(order.id)}">Yangi kod berish</button>` : ''}
                    <button class="btn border border-slate-200 px-3 py-2 text-xs hover:bg-slate-50" data-action="timeline" data-id="${esc(order.id)}">Tarix</button>
                    ${options.refund && hasPayments && order.status !== 'QAYTARILDI' ? `<button class="btn bg-rose-50 px-3 py-2 text-xs text-rose-700 hover:bg-rose-100" data-action="refund" data-id="${esc(order.id)}">Qaytarish</button>` : ''}
                </div>
            </article>`;
        }

        async function renderDashboard() {
            const result = await api('/api/cashier/dashboard');
            const data = result.data;
            const attention = data.activeOrders.flatMap(order => {
                const entries = [];
                const ageMinutes = Math.floor((Date.now() - new Date(order.createdAt).getTime()) / 60000);
                if (order.status === 'TOLOV_KUTILMOQDA') entries.push(`💳 #${order.orderNumber} — to‘lov kutilmoqda`);
                if (ageMinutes > 20 && ['YANGI', 'KUTILMOQDA', 'ADMIN_TASDIGINI_KUTMOQDA', 'TAYYOR', 'TOLOV_KUTILMOQDA'].includes(order.status)) {
                    entries.push(`⏱ #${order.orderNumber} — ${ageMinutes} daqiqadan beri kutmoqda`);
                }
                if (order.orderType === 'TAKEAWAY' && order.status === 'TOLANDI') entries.push(`🥡 #${order.orderNumber} — olib ketish tasdig‘i kutilmoqda`);
                if (order.takeawayVerification?.attempts > 0) entries.push(`⚠️ #${order.orderNumber} — noto‘g‘ri kod urinishlari: ${order.takeawayVerification.attempts}`);
                if (order.takeawayVerification && new Date(order.takeawayVerification.expiresAt) <= new Date() && !order.takeawayVerification.usedAt) {
                    entries.push(`🔴 #${order.orderNumber} — olib ketish kodi muddati tugagan`);
                }
                return entries;
            });
            const statusNames = { YANGI: 'Yangi', KUTILMOQDA: 'Kutilmoqda', ADMIN_TASDIGINI_KUTMOQDA: 'Tasdiq kutilmoqda', TASDIQLANDI: 'Tasdiqlangan', OSHXONAGA_YUBORILDI: 'Oshxonada', TAYYORLANMOQDA: 'Tayyorlanmoqda', TAYYOR: 'Tayyor', STOLGA_YETKAZILDI: 'Stolga yetkazildi', TOLOV_KUTILMOQDA: 'To‘lov kutilmoqda', QISMAN_TOLANDI: 'Qisman to‘landi' };
            document.getElementById('content').innerHTML = `
                <section class="grid grid-cols-2 gap-3 lg:grid-cols-4 xl:grid-cols-6">
                    ${statCard('Bugungi savdo', money(data.sales), '💵')}
                    ${statCard('Naqd', money(data.cash), '💴', 'emerald')}
                    ${statCard('Karta', money(data.card), '💳', 'indigo')}
                    ${statCard('Elektron to‘lov', money(data.electronic), '📲', 'cyan')}
                    ${statCard('Qarz qoldig‘i', money(data.debt), '📒', 'amber')}
                    ${statCard('Qaytarilgan', money(data.refunds), '↩️', 'rose')}
                    ${statCard('Bugungi xarajat', money(data.expenses), '💸', 'rose')}
                    ${statCard('Ochiq buyurtma', data.openOrders, '🧾')}
                    ${statCard('Soboy', data.takeawayOrders, '🥡', 'violet')}
                    ${statCard('Qarzdor mijoz', data.debtors, '👥', 'amber')}
                    ${statCard('Kassadagi joriy summa', data.registerCash === null ? 'Smena ochilmagan' : money(data.registerCash), '🏦', 'blue')}
                </section>
                <section class="card p-4 sm:p-5">
                    <div class="mb-4 flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-lg font-black">Buyurtma holatlari</h2><p class="text-xs text-slate-500">Real vaqt Socket.io yangilanishi</p></div><button class="btn bg-slate-100 px-3 py-2 text-sm" data-action="refresh">Yangilash</button></div>
                    <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-5">${Object.entries(statusNames).map(([key, label]) => `<div class="rounded-xl bg-slate-50 p-3"><p class="text-xs text-slate-500">${label}</p><b class="text-xl">${Number(data.statusCounts[key] || 0)}</b></div>`).join('')}</div>
                </section>
                <section class="card border-amber-200 p-4 sm:p-5"><h2 class="text-lg font-black">⚠️ Diqqat talab qilmoqda</h2><div class="mt-2 space-y-2 text-sm">${attention.length ? attention.map(item => `<p class="rounded-lg bg-amber-50 p-3 text-amber-900">${esc(item)}</p>`).join('') : '<p class="rounded-lg bg-emerald-50 p-3 text-emerald-800">Hozircha shoshilinch ogohlantirish yo‘q</p>'}${data.verificationAlerts ? `<p class="rounded-lg bg-rose-50 p-3 text-rose-800">Noto‘g‘ri verification urinishlari kuzatilgan kodlar: ${data.verificationAlerts}</p>` : ''}</div></section>
                <section><div class="mb-3 flex items-center justify-between"><h2 class="text-lg font-black">Faol buyurtmalar</h2><button class="text-sm font-bold text-blue-700" data-tab="orders">Barchasi →</button></div><div class="grid gap-3 xl:grid-cols-2">${data.activeOrders.length ? data.activeOrders.map(order => orderCard(order)).join('') : '<div class="card col-span-full p-8 text-center text-slate-500">Faol buyurtmalar yo‘q</div>'}</div></section>
                <section class="card p-4"><div class="flex items-center justify-between gap-3"><h2 class="font-black">🔔 Ofitsiant chaqiruvlari</h2><button class="btn bg-slate-100 px-3 py-2 text-xs" data-tab="calls">Ko‘rish</button></div><div id="dashboard-calls" class="mt-3 text-sm text-slate-500">Chaqiruvlar yuklanmoqda...</div></section>`;
            loadDashboardCalls();
        }

        async function loadDashboardCalls() {
            try {
                const { data } = await api('/api/cashier/waiter-calls');
                const container = document.getElementById('dashboard-calls');

                api('/api/cashier/orders')
            ]);
            const rooms = await roomsResponse.json();

                byTable.get(key).push(order);
            });
            document.getElementById('content').innerHTML = rooms.length ? rooms.map(room => `<section class="space-y-3"><div><h2 class="text-lg font-black">${esc(room.name)}</h2><p class="text-xs text-slate-500">${room.tables.length} ta stol</p></div><div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">${room.tables.map(table => {

                const statusColor = table.status === 'AVAILABLE' ? 'emerald' : table.status === 'PENDING' ? 'amber' : 'rose';
                return `<article class="card p-4"><div class="flex items-center justify-between"><b>Stol ${esc(table.number)}</b><span class="rounded-full bg-${statusColor}-50 px-2 py-1 text-xs font-bold text-${statusColor}-700">${table.status === 'AVAILABLE' ? 'Bo‘sh' : table.status === 'PENDING' ? 'Tasdiq kutilmoqda' : 'Band'}</span></div><p class="mt-2 text-sm text-slate-500">${orders.length} ta faol buyurtma</p><div class="mt-3 space-y-2">${orders.map(order => {

            const packaging = [...form.querySelectorAll('[data-package]:checked')].map(input => ({

        async function openPayment(orderId) {
            try {
                await api(`/api/cashier/orders/${encodeURIComponent(orderId)}/lock`, { method: 'POST' });
                const { data } = await api(`/api/cashier/orders?q=${encodeURIComponent(orderId)}`);
                const order = data.find(item => item.id === orderId);
                if (!order) throw new Error('Buyurtma topilmadi');
                state.currentOrder = order;
                const paid = order.payments.reduce((sum, payment) => sum + Number(payment.amount), 0);
                const due = Number(order.totalAmount) - paid - Number(order.debt?.amount || 0);
                openModal('To‘lovni qabul qilish', `<form id="payment-form" class="space-y-3"><div class="rounded-xl bg-blue-50 p-4"><p class="text-sm">Buyurtma #${esc(order.orderNumber)}</p><p class="text-2xl font-black">${money(due)}</p><p class="text-xs text-slate-500">Naqd, karta, elektron va qarz aralashtirish mumkin</p></div><div class="grid gap-3 sm:grid-cols-2"><label class="text-sm font-semibold">Naqd<input class="field mt-1" name="cash" type="number" min="0" step="0.01" value="${due}"></label><label class="text-sm font-semibold">Mijoz bergan naqd<input class="field mt-1" name="given" type="number" min="0" step="0.01" value="${due}"></label><label class="text-sm font-semibold">Karta<input class="field mt-1" name="card" type="number" min="0" step="0.01" value="0"></label><label class="text-sm font-semibold">Elektron<input class="field mt-1" name="electronic" type="number" min="0" step="0.01" value="0"></label><label class="text-sm font-semibold">Qarz qismi<input class="field mt-1" name="debt" type="number" min="0" step="0.01" value="0"></label><label class="text-sm font-semibold">Mijoz IDsi (qarz uchun)<input class="field mt-1" name="customerId" value="${esc(order.customer?.id || '')}"></label></div><p id="payment-sum" class="rounded-lg bg-slate-50 p-3 text-sm font-bold"></p><p id="payment-error" class="hidden text-sm text-rose-700"></p><button class="btn w-full bg-blue-600 px-4 py-3 text-white">To‘lovni tasdiqlash</button><button type="button" data-action="unlock-order" data-id="${esc(orderId)}" class="w-full py-2 text-sm font-semibold text-slate-500">Bekor qilish</button></form>`);
                const form = document.getElementById('payment-form');
                const update = () => {
                    const values = Object.fromEntries(new FormData(form).entries());
                    const amount = ['cash', 'card', 'electronic', 'debt'].reduce((sum, key) => sum + Number(values[key] || 0), 0);
                    form.querySelector('#payment-sum').textContent = `Kiritilgan: ${money(amount)} · Qoldiq: ${money(due - amount)}`;
                };
                form.addEventListener('input', event => {
                    if (event.target.name === 'cash') form.elements.given.value = event.target.value;
                    update();
                });
                update();
                form.addEventListener('submit', submitPayment);
            } catch (error) { await api(`/api/cashier/orders/${encodeURIComponent(orderId)}/unlock`, { method: 'POST' }).catch(() => {}); toast(error.message, 'error'); }
        }

        async function submitPayment(event) {
            event.preventDefault();
            const form = event.currentTarget;
            const values = Object.fromEntries(new FormData(form).entries());
            const due = Number(state.currentOrder.totalAmount) - state.currentOrder.payments.reduce((sum, payment) => sum + Number(payment.amount), 0) - Number(state.currentOrder.debt?.amount || 0);
            const cash = Number(values.cash || 0), card = Number(values.card || 0), electronic = Number(values.electronic || 0), debt = Number(values.debt || 0);
            const sum = cash + card + electronic + debt;
            const error = form.querySelector('#payment-error');
            if ([cash, card, electronic, debt].some(value => !Number.isFinite(value) || value < 0) || Math.abs(sum - due) > 0.001) {
                error.textContent = 'To‘lov va qarz summasi to‘lanadigan qoldiqqa teng bo‘lishi kerak';
                error.classList.remove('hidden');
                return;
            }
            if (debt > 0 && !values.customerId) { error.textContent = 'Qarz uchun mijoz IDsi kerak'; error.classList.remove('hidden'); return; }
            const payments = [
                ...(cash > 0 ? [{ method: 'NAQD', amount: cash, customerGiven: Number(values.given || cash) }] : []),
                ...(card > 0 ? [{ method: 'PLASTIK', amount: card }] : []),
                ...(electronic > 0 ? [{ method: 'ELEKTRON', amount: electronic }] : [])
            ];
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                await api('/api/cashier/payments', {
                    method: 'POST',
                    body: JSON.stringify({
                        orderId: state.currentOrder.id, payments, debtAmount: debt,
                        customerId: values.customerId || null, idempotencyKey: newKey()
                    })
                });
                closeModal();
                toast('To‘lov saqlandi. Chek chop etish navbatiga qo‘yildi.');
                await switchTab(state.tab);
            } catch (error) { form.querySelector('#payment-error').textContent = error.message; form.querySelector('#payment-error').classList.remove('hidden'); }
            finally { button.disabled = false; }
        }

        async function openRefund(id) {
            const { data } = await api(`/api/cashier/orders?q=${encodeURIComponent(id)}&closed=true`);

            const refunded = (order.refunds || []).flatMap(refund => refund.items || []).reduce((map, item) => {

                return `<label class="flex items-center justify-between gap-3 rounded-lg bg-slate-50 p-3 text-sm"><span>${esc(item.menuItem.name)} · Qaytarish mumkin ${available} / ${esc(item.quantity)} × ${money(item.unitPrice)}</span><input class="field w-28" data-refund-item="${esc(item.id)}" type="number" min="0" max="${available}" step="0.01" value="0" ${available === 0 ? 'disabled' : ''} aria-label="${esc(item.menuItem.name)} qaytarish miqdori"></label>`;

                    ? `<button class="block w-full rounded-lg p-2 text-left hover:bg-slate-50" data-action="timeline" data-id="${esc(item.id)}"><b>🧾 ${esc(item.orderNumber)}</b><p class="text-xs text-slate-500">${esc(item.status)} · ${item.table ? `Stol ${esc(item.table.number)}` : 'Olib ketish'} · ${money(item.totalAmount)}</p></button>`
                    : `<button class="block w-full rounded-lg p-2 text-left hover:bg-slate-50" data-action="customer-detail" data-id="${esc(item.id)}"><b>👤 ${esc(item.firstName)} ${esc(item.lastName)} · #${esc(item.customerNumber)}</b><p class="text-xs text-slate-500">${esc(item.phone || '')}</p></button>`).join('')
                    : '<p class="p-3 text-sm text-slate-500">Natija topilmadi</p>';
                resultRoot.classList.remove('hidden');
            } catch (error) { console.error('Umumiy qidiruv xatoligi:', error); }
        }

        async function action(event) {
            const button = event.target.closest('[data-action]');
            if (!button) {
                const tabButton = event.target.closest('[data-tab]');
                if (tabButton) switchTab(tabButton.dataset.tab);
                return;
            }
            const id = button.dataset.id;
            const actionName = button.dataset.action;
            try {
                if (actionName === 'refresh') await switchTab(state.tab);
                else if (actionName === 'pay') await openPayment(id);
                else if (actionName === 'timeline') await showTimeline(id);
                else if (actionName === 'refund') await openRefund(id);
                else if (actionName === 'verify-pickup') await verifyPickup(id);
                else if (actionName === 'renew-code') {
                    button.disabled = true;
                    try {
                        const { data } = await api(`/api/cashier/orders/${encodeURIComponent(id)}/verification/renew`, { method: 'POST' });
                        toast(data.telegramSent ? 'Yangi kod Telegram orqali yuborildi' : `Yangi kod: ${data.code}`);
                        await switchTab(state.tab);
                    } finally { button.disabled = false; }
                }
                else if (actionName === 'debt-pay') openDebtPayment(id, Number(button.dataset.amount));
                else if (actionName === 'customer-detail') {
                    if (state.tab !== 'customers') await switchTab('customers');
                    await showCustomer(id);
                }
                else if (actionName === 'new-customer') await openCustomerModal();
                else if (actionName === 'modal-close') closeModal();
                else if (actionName === 'new-order') {
                    await switchTab('orders');
                    document.getElementById('order-form')?.scrollIntoView({ behavior: 'smooth' });
                } else if (actionName === 'cart-add') {
                    const menuId = document.getElementById('builder-menu-item')?.value;
                    const quantity = Number(document.getElementById('builder-quantity')?.value);
                    const item = state.menu.find(menuItem => menuItem.id === menuId);
                    if (!item || !Number.isFinite(quantity) || quantity <= 0) { toast('Taom va to‘g‘ri miqdorni tanlang', 'error'); return; }
                    state.cart.push({ id: item.id, name: item.name, quantity, total: Number(item.sellingPrice) * quantity });
                    renderCartLines();
                } else if (actionName === 'cart-remove') { state.cart.splice(Number(button.dataset.index), 1); renderCartLines(); }
                else if (actionName === 'select-customer') {
                    document.querySelector('#order-form [name="customerId"]').value = id;
                    document.querySelector('#order-form [name="customerName"]').value = button.dataset.name;
                    document.getElementById('order-customer-results').innerHTML = '';
                } else if (actionName === 'unlock-order') {
                    await api(`/api/cashier/orders/${encodeURIComponent(id)}/unlock`, { method: 'POST' });
                    closeModal(); await switchTab(state.tab);
                } else if (actionName === 'call-status') {
                    await api(`/api/cashier/waiter-calls/${encodeURIComponent(id)}/status`, { method: 'POST', body: JSON.stringify({ status: button.dataset.status }) });
                    toast('Chaqiruv yangilandi'); await switchTab(state.tab);
                } else if (actionName === 'reprint') await reprintReceipt(id);
                else if (actionName === 'save-packaging') {
                    const inventoryId = document.getElementById('package-inventory').value;
                    const name = document.getElementById('package-name').value.trim();
                    const sellingPrice = document.getElementById('package-price').value;
                    await api('/api/cashier/packaging', { method: 'POST', body: JSON.stringify({ inventoryId, name, sellingPrice }) });
                    toast('Qadoqlash sozlamasi saqlandi');
                    await switchTab(state.tab);
                }
            } catch (error) { toast(error.message, 'error'); }
        }

        document.addEventListener('click', action);
        document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button');
            button.disabled = true;
            try {
                const result = await api('/api/cashier/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });
                state.user = result.user;
                showApp();
            } catch (error) {
                const box = document.getElementById('login-error');
                box.textContent = error.message;
                box.classList.remove('hidden');
            } finally { button.disabled = false; }
        });
        document.getElementById('global-search').addEventListener('input', event => {
            clearTimeout(state.searchTimer);
            state.searchTimer = setTimeout(() => showGlobalSearch(event.target.value), 250);
        });
        document.getElementById('admin-access-button').addEventListener('click', () => {
            openModal('Admin ruxsatini tasdiqlash', `<form id="admin-access-form" class="space-y-3"><p class="text-sm text-slate-600">Admin o‘z login va paroli bilan tasdiqlanadi. Kassir sessiyasi Admin hisobiga almashtirilmaydi.</p><label class="block text-sm font-semibold">Admin login<input class="field mt-1" name="username" required autocomplete="username"></label><label class="block text-sm font-semibold">Admin paroli<input class="field mt-1" name="password" type="password" required autocomplete="current-password"></label><p id="admin-access-error" class="hidden text-sm text-rose-700"></p><button class="btn w-full bg-violet-600 px-4 py-3 text-white">Admin sessiyasini ochish</button></form>`);
            document.getElementById('admin-access-form').addEventListener('submit', async event => {
                event.preventDefault();
                const form = event.currentTarget, button = form.querySelector('button'); button.disabled = true;
                try {
                    const { data } = await api('/api/cashier/admin-access', { method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(form).entries())) });
                    closeModal();
                    const session = await api('/api/cashier/me');
                    state.user = session.user;
                    showApp();
                    window.open(data.adminUrl, '_blank', 'noopener');
                    toast(`Admin ${data.admin} tizimga kirdi. Ish tugagach Kassir rejimiga qayting.`);
                } catch (error) { form.querySelector('#admin-access-error').textContent = error.message; form.querySelector('#admin-access-error').classList.remove('hidden'); }
                finally { button.disabled = false; }
            });
        });
        document.getElementById('return-cashier-button').addEventListener('click', async () => {
            try {
                await api('/api/cashier/admin-access/close', { method: 'POST' });
                const session = await api('/api/cashier/me');
                state.user = session.user;
                showApp();
                toast('Kassir rejimiga qaytdingiz');
            } catch (error) { toast(error.message, 'error'); }
        });
        document.getElementById('logout-button').addEventListener('click', async () => {
            try {
                if (state.user?.terminalAccessId) await api('/api/cashier/admin-access/close', { method: 'POST' });
                await api('/api/auth/logout', { method: 'POST' });
                state.user = null;
                showLogin();
            } catch (error) { toast(error.message, 'error'); }
        });

        socket.on('connect', () => {
            const status = document.getElementById('connection-status');
            status.textContent = 'Ulangan';
            status.className = 'rounded-full bg-emerald-100 px-2 py-1 text-emerald-800';
            if (state.user) switchTab(state.tab);
        });
        socket.on('disconnect', () => {
            const status = document.getElementById('connection-status');
            status.textContent = 'Uzildi';
            status.className = 'rounded-full bg-rose-100 px-2 py-1 text-rose-800';
        });
        ['orderUpdate', 'order_status_updated', 'paymentReceived', 'waiter_call', 'waiter_call_updated', 'cashMovement', 'debtUpdated', 'cashRegisterUpdated']
            .forEach(eventName => socket.on(eventName, () => { if (state.user) switchTab(state.tab); }));
        setInterval(() => {
            document.getElementById('live-clock').textContent = new Date().toLocaleString('uz-UZ', { dateStyle: 'short', timeStyle: 'short' });
        }, 1000);
        verifySession();
        window.addEventListener('pageshow', event => {
            if (event.persisted) {
                showLogin();
                verifySession();
            }
        });
    </script>
</body>
</html>
