<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ChoyxonaAzizxon</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-5 text-2xl font-bold tracking-wider text-amber-400 border-b border-slate-800">
                ChoyxonaAdmin
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="block px-4 py-2.5 rounded-lg bg-amber-600 text-white font-medium">Bosh sahifa</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Buyurtmalar</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Xonalar va Stollar</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Omborxona</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Menyu va Tannarx</a>
                <a href="#" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300">Xodimlar</a>
            </nav>
            <div class="p-4 border-t border-slate-800 text-sm text-slate-400">
                Azamatjon & Umidjon Restarani
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <!-- Header -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-8">
                <h1 class="text-xl font-semibold text-gray-800">Boshqaruv Paneli</h1>
                <div class="flex items-center space-x-4">
                    <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-1 rounded-full">Server Ishlayapti</span>
                    <div class="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold">A</div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <main class="p-8">
                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-500 font-medium">Bugungi Tushum</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1">0 so'm</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-500 font-medium">Faol Buyurtmalar</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1">0 ta</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-500 font-medium">Band Stollar</p>
                        <h3 class="text-2xl font-bold text-gray-800 mt-1">0 / 0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <p class="text-sm text-gray-500 font-medium">Kassa Holati</p>
                        <h3 class="text-2xl font-bold text-green-600 mt-1">Ochiq</h3>
                    </div>
                </div>

                <!-- Xonalarni boshqarish bo'limi -->
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold text-gray-800">Restoran Xonalari</h2>
                        <button onclick="loadRooms()" class="bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-amber-700 transition">Yangilash</button>
                    </div>
                    <div id="rooms-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <!-- Ma'lumotlar dinamik ravishda yuklanadi -->
                        <p class="text-gray-500 text-sm">Xonalar yuklanmoqda...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- JavaScript - API bilan bog'lanish -->
    <script>
        async function loadRooms() {
            try {
                const response = await fetch('/api/rooms');
                const rooms = await response.json();
                const container = document.getElementById('rooms-container');
                
                if (rooms.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-sm">Hozircha xonalar qo\'shilmagan.</p>';
                    return;
                }

                container.innerHTML = rooms.map(room => `
                    <div class="border border-gray-200 p-4 rounded-lg bg-gray-50">
                        <h3 class="font-bold text-gray-800 text-lg">${room.name}</h3>
                        <p class="text-sm text-gray-500 mt-1">Stollar soni: ${room.tables ? room.tables.length : 0} ta</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Xonalarni olishda xatolik:', error);
            }
        }

        // Sahifa ochilganda xonalarni yuklash
        loadRooms();
    </script>
</body>
</html>
