name: Windows installers (test)

on:
  workflow_dispatch:
  push:
    branches: [test-release-windows-v0.1]
    paths:
      - 'desktop/**'
      - 'scripts/build-desktop-apps.cjs'
      - 'scripts/verify-desktop-installers.cjs'
      - '.github/workflows/windows-installers.yml'
      - 'src/routes/kitchen.routes.ts'
      - 'public/kitchen-tv.*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend type-check and LAN discovery test
        run: |
          npm ci
          npm run build
          node scripts/verify-lan-discovery.cjs

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install icon tooling
        run: python -m pip install pillow

      - name: Build six NSIS installers
        run: node scripts/build-desktop-apps.cjs

      - name: Install, launch and verify all six apps
        run: node scripts/verify-desktop-installers.cjs

      - name: Checksums and instructions
        run: |
          cd dist-installers/release
          test "$(ls *-Setup.exe | wc -l)" = "6"
          sha256sum *-Setup.exe > SHA256SUMS.txt
          cp ../../docs/WINDOWS-INSTALL-UZ.md ORNATISH-UZ.md
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: azizxon-windows-installers
          path: |
            dist-installers/release/*-Setup.exe
            dist-installers/release/SHA256SUMS.txt
            dist-installers/release/ORNATISH-UZ.md
          if-no-files-found: error
          retention-days: 14
